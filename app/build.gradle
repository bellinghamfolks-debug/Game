plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hayatkafeef.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hayatkafeef.game'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        resConfigs 'ar', 'en'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError false
    }
}
