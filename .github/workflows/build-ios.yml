name: Millionaire iPhone
on:
  push:
    branches: [millionaire-ios]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish an optional GitHub Release (requires repository release permission)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: millionaire-validated-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: write
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate project and resources
        run: |
          mkdir -p dist/logs
          xcodebuild -version | tee dist/logs/toolchain.txt
          python3 Tools/generate_project.py --check
          python3 Tools/check_bank.py | tee dist/logs/questions.txt
      - name: Build and verify unsigned iPhone release
        run: bash Tools/release.sh
      - name: Upload verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Millionaire-iOS-Unsigned
          path: dist/Millionaire-iOS-Unsigned.ipa
          if-no-files-found: error
      - name: Upload editable sources and device app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Millionaire-project-and-app
          path: |
            dist/Millionaire.app.zip
            dist/Millionaire-source.zip
          if-no-files-found: error
      - name: Test gameplay and interface on iPhone
        run: |
          set -euo pipefail
          export SIM_RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-$(xcrun --sdk iphonesimulator --show-sdk-version | tr . -)
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import os,sys,json; print(next(d["udid"] for d in json.load(sys.stdin)["devices"][os.environ["SIM_RUNTIME"]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -scheme Millionaire -project Millionaire.xcodeproj -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -derivedDataPath "$RUNNER_TEMP/MillionaireTests" -resultBundlePath dist/logs/Tests.xcresult test | tee dist/logs/tests.log
      - name: Summarize the actual test run
        if: always() && hashFiles('dist/logs/Tests.xcresult/Info.plist') != ''
        run: |
          xcrun xcresulttool get test-results summary --path dist/logs/Tests.xcresult > dist/logs/test-summary.json
          xcrun xcresulttool export attachments --path dist/logs/Tests.xcresult --output-path dist/logs/attachments
          python3 Tools/result_summary.py dist/logs/test-summary.json | tee dist/logs/Test-Results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-and-test-evidence
          path: dist/logs
      - name: Publish signed-off test build as downloadable files
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/millionaire-ios'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="millionaire-ios-${GITHUB_SHA:0:8}"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title "من سيربح المليون • iPhone" --notes "Unsigned device build. See the Actions run for test results." dist/Millionaire-iOS-Unsigned.ipa dist/Millionaire.app.zip dist/Millionaire-source.zip dist/logs/SHA256.txt dist/logs/Test-Results.md
