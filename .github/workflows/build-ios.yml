name: Millionaire iPhone
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: millionaire-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate project and resources
        run: |
          mkdir -p dist/logs
          xcodebuild -version | tee dist/logs/toolchain.txt
          python3 Tools/generate_project.py --check
          python3 Tools/check_bank.py | tee dist/logs/questions.txt
      - name: Build and verify unsigned iPhone release
        run: bash Tools/release.sh
      - name: Test gameplay and interface on iPhone
        run: |
          set -euo pipefail
          export SIM_RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-$(xcrun --sdk iphonesimulator --show-sdk-version | tr . -)
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import os,sys,json; print(next(d["udid"] for d in json.load(sys.stdin)["devices"][os.environ["SIM_RUNTIME"]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -scheme Millionaire -project Millionaire.xcodeproj -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -derivedDataPath "$RUNNER_TEMP/MillionaireTests" -resultBundlePath dist/logs/Tests.xcresult test | tee dist/logs/tests.log
      - name: Upload verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Millionaire-iOS-Unsigned
          path: dist/Millionaire-iOS-Unsigned.ipa
          if-no-files-found: error
      - name: Upload editable sources and device app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Millionaire-project-and-app
          path: |
            dist/Millionaire.app.zip
            dist/Millionaire-source.zip
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-and-test-evidence
          path: dist/logs
